name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML for skill validation
        run: python -m pip install pyyaml

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Check shell script syntax
        run: bash -n skills/t3-gemini-bridge/scripts/install.sh

      - name: Validate SKILL.md, openai.yaml, and plugin manifests
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import yaml

          skill_dir = Path("skills/t3-gemini-bridge")
          skill_md = skill_dir / "SKILL.md"
          content = skill_md.read_text(encoding="utf-8")
          assert content.startswith("---"), "SKILL.md must start with YAML frontmatter"
          m = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          assert m, "Invalid SKILL.md frontmatter"
          fm = yaml.safe_load(m.group(1))
          assert isinstance(fm, dict)
          allowed = {"name", "description", "license", "allowed-tools", "metadata"}
          assert set(fm.keys()).issubset(allowed), f"Unexpected keys: {set(fm.keys()) - allowed}"
          assert re.fullmatch(r"[a-z0-9-]+", fm["name"]) and len(fm["name"]) <= 64
          desc = fm["description"].strip()
          assert desc and "<" not in desc and ">" not in desc and len(desc) <= 1024

          openai_yaml = yaml.safe_load((skill_dir / "agents/openai.yaml").read_text(encoding="utf-8"))
          assert isinstance(openai_yaml, dict)
          assert "interface" in openai_yaml and "policy" in openai_yaml

          for jp in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              json.loads(Path(jp).read_text(encoding="utf-8"))
          print("All skill, YAML, and JSON validations passed.")
          PY

      - name: Check for personal home paths
        run: |
          if grep -rnE '/Users/[A-Za-z0-9_.-]+' skills/ tests/ .claude-plugin/ README*.md; then
            echo "Found hardcoded /Users/ path!"
            exit 1
          fi

  python-39-stdlib-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9 (zero third-party packages)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run pure-stdlib unit and MCP subprocess tests on Python 3.9
        run: python -B -m unittest discover -s tests -v
